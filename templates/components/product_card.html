<article class="prod">
  <div class="prod__media">
    <img class="prod__img" src="{{ product.image_url }}" alt="{{ product.name }}">
  </div>

  <div class="prod__body">
    <h2 class="prod__name"><span class="prod__num">{{ product.index }}</span> {{ product.name_html | safe }}</h2>
    <p class="prod__subtitle">{{ product.subtitle_html | safe }}</p>

    <span class="prod__rule"></span>

    <div class="feats">
      {% for bullet in product.bullets %}
        <div class="feat">{{ bullet }}</div>
      {% endfor %}
    </div>

    <div class="mrp">
      <span class="mrp__label">DP</span>
      <span class="mrp__price">₹{{ product.price }}</span>
      <span class="mrp__gst">incl. GST</span>
    </div>
  </div>
</article>
